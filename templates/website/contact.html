{% extends 'base.html' %}

{% block title %}
  Contact Us
{% endblock %}

{% block content %}
  <div class="row">
    <div class="col-lg-8 mx-auto">
      <div class="card shadow">
        <div class="card-body p-4 p-lg-5">
          <h1 class="display-5 mb-4">Contact Us</h1>

          <p class="lead mb-4">Have questions or feedback? We'd love to hear from you.</p>

          <div class="row mb-5">
            <div class="col-md-4 mb-4 mb-md-0">
              <div class="text-center mb-4">
                <i class="bi bi-envelope text-primary" style="font-size: 2.5rem;"></i>
              </div>
              <h3 class="h5 text-center mb-2">Email</h3>
              <p class="text-center mb-0">
                <a href="mailto:support@notesapp.com" class="text-decoration-none">support@notesapp.com</a>
              </p>
            </div>
            <div class="col-md-4 mb-4 mb-md-0">
              <div class="text-center mb-4">
                <i class="bi bi-chat-dots text-primary" style="font-size: 2.5rem;"></i>
              </div>
              <h3 class="h5 text-center mb-2">Live Chat</h3>
              <p class="text-center mb-0">
                Available Monday-Friday<br />9am-5pm EST
              </p>
            </div>
            <div class="col-md-4">
              <div class="text-center mb-4">
                <i class="bi bi-question-circle text-primary" style="font-size: 2.5rem;"></i>
              </div>
              <h3 class="h5 text-center mb-2">Help Center</h3>
              <p class="text-center mb-0">
                <a href="{% url 'website:faq' %}" class="text-decoration-none">Visit our FAQ</a>
              </p>
            </div>
          </div>

          <hr class="my-5" />

          <h2 class="h3 mb-4">Send us a message</h2>

          <form>
            <div class="row mb-3">
              <div class="col-md-6 mb-3 mb-md-0">
                <label for="name" class="form-label">Name</label>
                <input type="text" class="form-control" id="name" placeholder="Your name" />
              </div>
              <div class="col-md-6">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" placeholder="Your email" />
              </div>
            </div>
            <div class="mb-3">
              <label for="subject" class="form-label">Subject</label>
              <input type="text" class="form-control" id="subject" placeholder="Message subject" />
            </div>
            <div class="mb-4">
              <label for="message" class="form-label">Message</label>
              <textarea class="form-control" id="message" rows="5" placeholder="Your message"></textarea>
            </div>
            <div class="text-end">
              <button type="submit" class="btn btn-primary"><i class="bi bi-send me-2"></i>Send Message</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
